plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.psychocare'
    compileSdk 34

    defaultConfig {
        applicationId "com.psychocare"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'  // Kotlin 1.9.24 호환
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Gemma .bin 모델 파일 압축 방지 (assets 폴더 내 모델 파일)
    aaptOptions {
        noCompress "bin"
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/DEPENDENCIES'
        }
    }
}

dependencies {
    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // ML Kit - 얼굴 감지 (감정 분석)
    implementation 'com.google.mlkit:face-detection:16.1.5'
    // ML Kit - 이미지 라벨링 (취미/활동 분류)
    implementation 'com.google.mlkit:image-labeling:17.0.7'
    // ML Kit - 객체 탐지
    implementation 'com.google.mlkit:object-detection:17.0.1'

    // MediaPipe - Gemma on-device LLM
    implementation 'com.google.mediapipe:tasks-genai:0.10.20'

    // EXIF 데이터 읽기 (촬영시간, GPS)
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Room Database - 분석 결과 저장
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Coil - 이미지 로딩
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Material Icons Extended (Chat, Forum 등 아이콘 포함)
    implementation 'androidx.compose.material:material-icons-extended'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // DataStore - 설정 저장
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // WorkManager - 백그라운드 사진 분석
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
