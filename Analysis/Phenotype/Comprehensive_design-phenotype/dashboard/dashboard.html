<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Mental Health Counselor — 개발자 대시보드</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Malgun Gothic','맑은 고딕',sans-serif;
    background:#0a0a14; color:#e8e8f0; height:100vh; overflow:hidden;
  }
  .grid { display:grid; grid-template-columns:300px 1fr 420px; height:100vh; gap:1px; background:#1a1a2e; }
  .panel { background:#0d0d1a; overflow-y:auto; padding:20px; }
  .panel::-webkit-scrollbar { width:6px; }
  .panel::-webkit-scrollbar-thumb { background:#33334d; border-radius:3px; }
  h2 { font-size:13px; letter-spacing:2px; color:#8888aa; margin-bottom:16px; font-weight:600; }
  h3 { font-size:11px; color:#666688; text-transform:uppercase; letter-spacing:1px; margin:14px 0 6px; }
  .big-title { font-size:22px; font-weight:300; letter-spacing:1px; }
  .grad { background:linear-gradient(90deg,#a78bfa,#60a5fa,#34d399); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  /* 좌측 프로필 */
  .field { margin-bottom:10px; }
  .field .label { font-size:10px; color:#666688; }
  .field .value { font-size:13px; color:#d8d8e8; margin-top:2px; }
  .tag { display:inline-block; background:#1e1e3a; color:#a78bfa; padding:3px 10px; border-radius:12px; font-size:11px; margin:3px 3px 0 0; }

  /* 프롬프트 박스 */
  .prompt-box {
    background:#070710; border:1px solid #1e1e3a; border-radius:8px; padding:12px;
    font-family:'Consolas','D2Coding',monospace; font-size:11px; line-height:1.5;
    white-space:pre-wrap; word-break:break-all; color:#9fc; max-height:340px; overflow-y:auto;
  }
  .prompt-box .sys { color:#fbbf24; }
  .prompt-box .ctx { color:#60a5fa; }
  .char-count { font-size:10px; color:#666688; text-align:right; margin-top:4px; }

  /* 중앙 채팅 */
  .chat { display:flex; flex-direction:column; gap:12px; padding:8px 0; }
  .msg { max-width:78%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.5; }
  .msg.user { align-self:flex-end; background:linear-gradient(135deg,#7c3aed,#a78bfa); color:#fff; }
  .msg.assistant { align-self:flex-start; background:#1a1a2e; border:1px solid #2a2a44; }
  .msg.system { align-self:center; background:#15152a; color:#8888aa; font-size:11px; text-align:center; max-width:90%; }
  .msg .role { font-size:9px; opacity:.6; margin-bottom:3px; text-transform:uppercase; }

  /* 우측 인사이트 */
  .gauge { margin-bottom:12px; }
  .gauge .top { display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px; }
  .gauge .bar { height:18px; background:#15152a; border-radius:9px; overflow:hidden; }
  .gauge .fill { height:100%; border-radius:9px; transition:width .6s; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; font-size:10px; font-weight:700; color:#fff; }

  .insight-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:20px; }
  canvas { display:block; margin:0 auto; }

  .rank-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #1a1a2e; font-size:11px; }
  .rank-row .num { width:18px; height:18px; border-radius:50%; background:#2a2a44; display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0; }
  .rank-row .txt { flex:1; color:#c8c8dd; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-row .pct { color:#a78bfa; font-weight:700; }

  .status { position:fixed; top:8px; right:12px; font-size:10px; padding:3px 10px; border-radius:10px; }
  .status.live { background:#10391f; color:#34d399; }
  .status.wait { background:#3a3a15; color:#fbbf24; }
  .empty { color:#555577; font-size:12px; text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div id="status" class="status wait">● 대기 중</div>
<div class="grid">

  <!-- 좌측: Overview -->
  <div class="panel">
    <h2>OVERVIEW</h2>
    <h3>분석 프로필</h3>
    <div id="profile"></div>

    <h3>Counseling Prompt</h3>
    <div class="prompt-box" id="counselingCtx"><span class="empty">데이터 대기 중</span></div>

    <h3>세션 성취도</h3>
    <div id="achievement"></div>
  </div>

  <!-- 중앙: 채팅 + 프롬프트 -->
  <div class="panel">
    <div class="big-title grad">AI Mental Health Counselor</div>
    <div style="font-size:11px;color:#666688;margin:4px 0 16px;" id="modelInfo">모델 대기 중</div>

    <h3>실시간 채팅</h3>
    <div class="chat" id="chat"><div class="empty">핸드폰에서 상담을 시작하세요</div></div>

    <h3 style="margin-top:20px;">LLM에 전송된 프롬프트 전문</h3>
    <div class="prompt-box" id="fullPrompt"><span class="empty">메시지 전송 시 표시됩니다</span></div>
    <div class="char-count" id="charCount"></div>
  </div>

  <!-- 우측: Psychological Insights -->
  <div class="panel">
    <h2 class="grad" style="font-size:18px;">Psychological Insights</h2>

    <div id="gauges"></div>

    <h3 style="margin-top:20px;">감정 레이더</h3>
    <canvas id="radar" width="340" height="240"></canvas>

    <h3 style="margin-top:16px;">감정 분포</h3>
    <div id="emotionDist"></div>

    <h3 style="margin-top:16px;">피노타입 신호</h3>
    <div id="phenotype"></div>
  </div>

</div>

<script>
const POLL_MS = 1500;
let lastTs = 0;

async function poll() {
  try {
    const r = await fetch('/data?t=' + Date.now());
    if (!r.ok) throw new Error('no data');
    const d = await r.json();
    setStatus(true);
    render(d);
  } catch(e) {
    setStatus(false);
  }
}

function setStatus(live) {
  const el = document.getElementById('status');
  el.className = 'status ' + (live?'live':'wait');
  el.textContent = live ? '● LIVE' : '● 대기 중';
}

function esc(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(d) {
  // 모델 정보
  const mp = (d.modelPath||'').split('/').pop();
  document.getElementById('modelInfo').textContent =
    '모델: ' + mp + '  ·  ' + new Date(d.timestamp).toLocaleTimeString('ko-KR');

  // 프로필
  if (d.profile) {
    const p = d.profile;
    document.getElementById('profile').innerHTML =
      field('주요 감정', p.dominantEmotion) +
      field('활동 시간대', p.activeTimeOfDay) +
      field('사회성', p.socialLevel) +
      field('촬영 빈도', p.photoFrequency) +
      field('분석 사진', p.analyzedPhotoCount + '장') +
      '<h3>취미/관심사</h3>' + (p.topHobbies||[]).map(h=>`<span class="tag">${esc(h)}</span>`).join('');
  }

  // Counseling Context
  document.getElementById('counselingCtx').textContent = d.counselingContext || '(분석 데이터 없음)';

  // 전체 프롬프트 (시스템/컨텍스트 색상 구분)
  let fp = esc(d.fullPrompt||'');
  document.getElementById('fullPrompt').innerHTML = fp || '<span class="empty">대기 중</span>';
  document.getElementById('charCount').textContent = d.promptCharCount ? (d.promptCharCount + ' 자') : '';

  // 채팅
  const chat = document.getElementById('chat');
  if (d.messages && d.messages.length) {
    chat.innerHTML = d.messages.map(m => {
      const cls = m.role.toLowerCase();
      return `<div class="msg ${cls}"><div class="role">${m.role}</div>${esc(m.content)}</div>`;
    }).join('');
    chat.scrollTop = chat.scrollHeight;
  }

  // 인사이트 게이지
  if (d.insights) {
    const i = d.insights;
    document.getElementById('gauges').innerHTML =
      gauge('위험도 / Risk Level', i.riskLevel, '#f472b6') +
      gauge('진정성 / Authenticity', i.authenticity, '#fbbf24') +
      gauge('개방성 / Openness', i.openness, '#34d399') +
      gauge('감정 점수(0=부정,100=긍정)', Math.round((i.emotionalScore+1)/2*100), '#60a5fa');

    drawRadar(i);

    // 감정 분포
    const dist = i.emotionDistribution || {};
    document.getElementById('emotionDist').innerHTML =
      Object.entries(dist).filter(([k,v])=>v>0.01)
        .sort((a,b)=>b[1]-a[1])
        .map(([k,v])=>gauge(k, Math.round(v*100), '#a78bfa')).join('') || '<div class="empty">데이터 없음</div>';
  }

  // 피노타입
  if (d.phenotype) {
    const ph = d.phenotype;
    let html = '';
    if (ph.callsThisWeek != null) html += field('이번주 통화', ph.callsThisWeek + '건 (지난주 ' + (ph.callsPrevWeek??'-') + '건)');
    if (ph.callWeeklyChangePct != null) html += field('통화 변화율', Math.round(ph.callWeeklyChangePct) + '%');
    if (ph.isolationAlert) html += '<div style="color:#f472b6;font-size:11px;margin:4px 0;">🚨 대인교류 급감 경보</div>';
    if (ph.dailyScreenTimeMin != null) html += field('일평균 스크린타임', ph.dailyScreenTimeMin + '분');
    if (ph.lateNightMin != null) html += field('야간 사용', ph.lateNightMin + '분/일');
    if (ph.longestSessionMin != null) html += field('최장 세션', ph.longestSessionMin + '분');
    document.getElementById('phenotype').innerHTML = html || '<div class="empty">수집 안됨</div>';
  }
}

function field(label, value){
  return `<div class="field"><div class="label">${esc(label)}</div><div class="value">${esc(String(value))}</div></div>`;
}
function gauge(label, pct, color){
  pct = Math.max(0, Math.min(100, pct||0));
  return `<div class="gauge"><div class="top"><span>${esc(label)}</span></div>
    <div class="bar"><div class="fill" style="width:${pct}%;background:${color};">${pct}%</div></div></div>`;
}

// 감정 레이더 차트
function drawRadar(i){
  const c = document.getElementById('radar'), ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  const cx=c.width/2, cy=c.height/2, R=85;
  const axes = [
    ['위험도', i.riskLevel/100],
    ['진정성', i.authenticity/100],
    ['개방성', i.openness/100],
    ['긍정도', (i.emotionalScore+1)/2]
  ];
  const n = axes.length;
  // 격자
  ctx.strokeStyle='#2a2a44'; ctx.fillStyle='#6666aa'; ctx.font='10px sans-serif';
  for(let ring=1; ring<=4; ring++){
    ctx.beginPath();
    for(let k=0;k<=n;k++){
      const a=Math.PI*2*k/n - Math.PI/2, r=R*ring/4;
      const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
      k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  // 데이터
  ctx.beginPath();
  axes.forEach((ax,k)=>{
    const a=Math.PI*2*k/n - Math.PI/2, r=R*Math.max(0.02,ax[1]);
    const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle='rgba(167,139,250,.35)'; ctx.fill();
  ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2; ctx.stroke();
  // 라벨
  ctx.fillStyle='#aaaacc';
  axes.forEach((ax,k)=>{
    const a=Math.PI*2*k/n - Math.PI/2, r=R+18;
    const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    ctx.textAlign='center'; ctx.fillText(ax[0], x, y+3);
  });
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
